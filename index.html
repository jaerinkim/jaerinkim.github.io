<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리얼라인 | Realine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: #0a0e27;
            color: #e0e6ed;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Animated background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(100, 200, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 200, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        /* Header */
        header {
            position: relative;
            padding: 60px 0 40px;
            text-align: center;
        }

        .logo {
            font-size: 3em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .logo-subtitle {
            font-size: 1em;
            color: #8892b0;
            letter-spacing: 3px;
            font-weight: 300;
        }

        /* Hero section */
        .hero {
            position: relative;
            padding: 100px 0 80px;
            text-align: center;
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-content {
            max-width: 800px;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 24px;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.4);
            border-radius: 25px;
            font-size: 0.9em;
            color: #667eea;
            margin-bottom: 40px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .hero h1 {
            font-size: 3.5em;
            line-height: 1.3;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.3em;
            color: #8892b0;
            line-height: 1.8;
            margin-bottom: 50px;
        }

        /* Info section */
        .info-section {
            position: relative;
            padding: 80px 0;
            text-align: center;
        }

        .info-box {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(17, 25, 40, 0.6);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 16px;
            padding: 60px 40px;
            backdrop-filter: blur(10px);
        }

        .info-box h2 {
            font-size: 2em;
            margin-bottom: 25px;
            color: #ccd6f6;
        }

        .info-box p {
            font-size: 1.1em;
            color: #8892b0;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .launch-date {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            color: white;
            font-size: 1.2em;
            font-weight: 600;
        }

        /* Email section */
        .email-section {
            position: relative;
            padding: 80px 0 100px;
            text-align: center;
        }

        .email-section h2 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #ccd6f6;
        }

        .email-section p {
            font-size: 1.1em;
            color: #8892b0;
            margin-bottom: 40px;
        }

        .email-form {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .email-form input {
            flex: 1;
            padding: 18px 24px;
            background: rgba(17, 25, 40, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 10px;
            color: #e0e6ed;
            font-size: 1em;
            outline: none;
            transition: all 0.3s ease;
        }

        .email-form input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .email-form button {
            padding: 18px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .email-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        /* Footer */
        footer {
            position: relative;
            padding: 50px 0;
            text-align: center;
            border-top: 1px solid rgba(100, 200, 255, 0.1);
            color: #8892b0;
            font-size: 0.95em;
        }

        footer p {
            margin: 8px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.2em;
            }

            .hero h1 {
                font-size: 2.2em;
            }

            .hero p {
                font-size: 1.1em;
            }

            .info-box {
                padding: 40px 30px;
            }

            .email-form {
                flex-direction: column;
            }

            .email-form button {
                width: 100%;
            }
        }

        /* Subtle animation for hero */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-content > * {
            animation: fadeInUp 1s ease-out;
        }

        .hero-content > *:nth-child(2) {
            animation-delay: 0.2s;
        }

        .hero-content > *:nth-child(3) {
            animation-delay: 0.4s;
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>

    <header>
        <div class="container">
            <div class="logo">리얼라인</div>
            <div class="logo-subtitle">REALINE</div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="status-badge">개발 중 | Coming Soon</div>
                <h1>
                    소상공인을 위한<br>
                    <span>새로운 기준선</span>
                </h1>
            </div>
        </div>
    </section>
